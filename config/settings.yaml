# Настройки искателя. Меняйте прямо здесь (на GitHub — значок карандаша).

ai:
  provider: anthropic        # anthropic | openrouter
  model: claude-haiku-5-5    # для openrouter — точное имя модели с openrouter.ai/models (бесплатные оканчиваются на ":free")
  max_per_run: 40            # не больше стольких заказов к ИИ за один запуск
  monthly_limit: 3000        # и не больше стольких запросов в месяц
  time_budget_s: 360         # и не дольше 6 минут на ИИ за запуск (остальные заказы придут без отклика)

notify:
  min_score: 6               # в Telegram — только заказы с оценкой от 6 из 10
  delay_s: 1                 # пауза между сообщениями, чтобы Telegram не ограничивал

filter:
  min_budget: 0              # 0 = любые бюджеты; заказы без бюджета проходят всегда

history:
  max_items: 500             # сколько заказов хранить в веб-панели

health:
  fail_threshold: 3          # после стольких сбоев подряд — предупреждение в Telegram

sources:
  enabled: [flru, kwork, freelancer, hn, telegram, freelance_ru, pph]   # guru убран: отвечает 403 на автозапросы
  telegram_channels: [freelancetaverna, zakazy_freelance, freelancce, theyseeku, normrabota]
