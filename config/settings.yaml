# Finder settings. Edit this file directly (on GitHub, use the pencil icon).

ai:
  provider: anthropic        # anthropic | openrouter
  model: claude-haiku-5-5    # For OpenRouter, use the exact model name from openrouter.ai/models (free models end in ":free").
  max_per_run: 40            # Maximum jobs sent to AI per run.
  monthly_limit: 3000        # Maximum AI requests per month.
  time_budget_s: 360         # Maximum AI time per run; remaining jobs arrive without proposals.

notify:
  min_score: 6               # Send only jobs scored 6/10 or higher to Telegram.
  delay_s: 1                 # Pause between messages to avoid Telegram rate limits.
  max_per_run: 1            # send only the single best job per run (one per hour)
  priority_sources: [freelancer]   # these sources get a score bonus and are analyzed first
  priority_bonus: 3

filter:
  min_budget: 0              # 0 = any budget; jobs with no listed budget always pass.

history:
  max_items: 500             # Number of jobs to keep in the web dashboard.

health:
  fail_threshold: 3          # Send a Telegram alert after this many consecutive failures.

sources:
  enabled: [freelancer, hn, pph]   # only international sites; Russian ones removed (no IBAN/crypto/EUR-card payouts)
