ь и сразу покинули игру;\r\n&bull; накрутка и другой искусственный трафик.\r\nДля отслеживания каждому исполнителю будет предоставлена отдельная реферальная ссылка/метка. По ней можно будет проверить количество новых регистраций, активность и возвраты пользователей.\r\nГлавное условие\r\nОплачивается именно согласованный результат по привлечённым активным игрокам.\r\nРасходы на способы привлечения отдельно с моей стороны не оплачиваются.","files":[],"kwork_count":0,"lang":"ru","name":"Привлечь активных игроков в браузерную онлайн-игру","max_days":"30","priceLimit":"3000.00","user":{"USERID":5342008,"username":"guland1969","profilepicture":"00/5342008-1.jpg","profilePictureSrcSet":"https://cdn-edge.kwork.ru/files/avatar/big/00/5342008-1.jpg?ver=1679645496 1x, https://cdn-edge.kwork.ru/files/avatar/big_r/00/5342008-1.jpg?ver=1679645496 2x","badges":[{"id":1825594,"user_id":"5342008","badge_id":"14","date_create":"2025-04-24 10:03:54","badge":{"id":14,"title":"Освоившийся покупатель","description":"Сделано более 7 покупок","super_title":"Освоившийся суперпокупатель","super_description":"Сделано более 7 покупок  и не менее 12 покупок за последние 3 месяца.","payer_level":2,"is_super_payer":false,"sort":"1"}},{"id":1972670,"user_id":"5342008","badge_id":"42","date_create":"2025-11-27 14:04:09","badge":{"id":42,"title":"Более 5 лет с Kwork","description":"","super_title":null,"super_description":null,"payer_level":null,"is_super_payer":false,"sort":"0"}}],"data":{"wants_count":"40","wants_hired_percent":"96"}},"date_active":"2026-11-24 20:53:07","date_expire":"2026-11-25 20:53:07","date_create":"2026-10-27 23:46:30","views_dirty":"4942","isUserWant":false,"alreadyWork":null,"isOtherActiveWantsExceptByWantId":false,"timeLeft":"23 ч. 49 мин.","currentUserReviewType":null,"hasPortfolioAvailable":false,"isNeural":false,"orderManagerStatusDone":5,"availableDurations":[1,2,3,4,5,6,7,10,14,21,30,45,60,75,90],"categoryLinksIdRu":59,"getPriceThreshold":4000},{"userAlreadyWork":nul
