name: Job Finder

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREELANCER_TOKEN: ${{ secrets.FREELANCER_TOKEN }}
          FREELANCER_USER_ID: ${{ secrets.FREELANCER_USER_ID }}
        run: python -m finder.run

      - name: Save state and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update jobs"
            git pull --rebase
            git push
          fi

  # GitHub's cron is unreliable on this repo (hours of missed runs), so the workflow
  # re-triggers itself ~hourly. The schedule above stays as a backup.
  next:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait, then trigger next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3300
          curl -sS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/finder.yml/dispatches"             -d '{"ref":"${{ github.ref_name }}"}'
