name: Искатель заказов

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (GitHub может запускать с опозданием)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Найти заказы
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m finder.run

      - name: Сохранить состояние и историю
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "data: обновление заказов"
            git pull --rebase
            git push
          fi
